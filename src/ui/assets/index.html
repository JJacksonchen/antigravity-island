<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Antigravity Island</title>
  <style>
/*__STYLE__*/
  </style>
</head>
<body>
  <div id="root" class="stage mode-island" data-health="ok" data-expanded="false">
    <div id="island-shell" class="island-shell">
      <!-- Collapsed Dynamic Island / Glance Pill -->
      <div id="pill-view" class="pill-view" role="button" tabindex="0" aria-label="Antigravity Quota Summary">
        <div class="pill-left">
          <span class="status-dot" id="pill-dot"></span>
          <span class="brand-glyph" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none">
              <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.8" stroke-dasharray="40 14" stroke-linecap="round"/>
              <circle cx="12" cy="12" r="2.6" fill="currentColor"/>
              <circle cx="17.8" cy="6.2" r="1.7" fill="currentColor"/>
            </svg>
          </span>
          <div id="pill-metrics-left" class="pill-metrics"></div>
        </div>
        <div id="notch-spacer" class="notch-spacer"></div>
        <div class="pill-right">
          <div id="pill-metrics-right" class="pill-metrics"></div>
          <span id="pill-sync-spin" class="sync-spin hidden" title="Syncing"></span>
        </div>
        <div class="pill-ambient-rail" aria-hidden="true">
          <div id="pill-ambient-fill" class="pill-ambient-fill"></div>
        </div>
      </div>

      <!-- Expanded Dynamic Island / Widget Dashboard -->
      <div id="expanded-view" class="expanded-view hidden">
        <header class="card-header" id="drag-header">
          <div class="header-left">
            <span class="status-dot" id="header-dot"></span>
            <span class="brand-glyph small" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none">
                <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.8" stroke-dasharray="40 14" stroke-linecap="round"/>
                <circle cx="12" cy="12" r="2.6" fill="currentColor"/>
                <circle cx="17.8" cy="6.2" r="1.7" fill="currentColor"/>
              </svg>
            </span>
            <div class="title-stack">
              <div class="title-row">
                <span class="app-title">Antigravity</span>
                <span id="plan-badge" class="badge badge-plan">--</span>
                <span id="demo-badge" class="badge badge-demo hidden">DEMO</span>
              </div>
              <div class="meta-row">
                <span id="source-label">--</span>
                <span class="sep">·</span>
                <span id="sync-age">--</span>
                <span id="credits-label" class="credits-chip hidden"></span>
              </div>
            </div>
          </div>
          <div class="header-actions">
            <button class="icon-btn" id="btn-pin" title="Pin expanded">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16h14v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/>
              </svg>
            </button>
            <button class="icon-btn" id="btn-refresh" title="Refresh now">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/>
              </svg>
            </button>
            <button class="icon-btn" id="btn-mode" title="Switch Island / Widget mode">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 7h8"/>
              </svg>
            </button>
            <button class="icon-btn" id="btn-skins" title="Skin Studio">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/>
              </svg>
            </button>
            <button class="icon-btn" id="btn-settings" title="Settings">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.604.852.997 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
              </svg>
            </button>
            <button class="icon-btn" id="btn-hide" title="Hide Island">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                <line x1="2" x2="22" y1="2" y2="22"/>
              </svg>
            </button>
          </div>
        </header>

        <!-- Primary Quota Groups -->
        <main id="groups-container" class="groups-container"></main>

        <!-- Offline Card -->
        <section id="offline-card" class="offline-card hidden">
          <div class="offline-title" id="offline-title">Waiting for Antigravity</div>
          <div class="offline-desc" id="offline-desc">Open Antigravity App / IDE or run agy CLI to sync live quota automatically.</div>
          <div class="offline-actions">
            <button class="pill-btn primary" id="btn-retry">Retry Sync</button>
            <button class="pill-btn" id="btn-demo-preview">Preview Demo</button>
          </div>
        </section>

        <!-- Inline Skin Studio Drawer -->
        <section id="drawer-skins" class="drawer hidden">
          <div class="drawer-header">
            <span class="drawer-title" id="skin-studio-title">Skin Studio</span>
            <button class="link-btn" id="btn-open-skins-dir">Open Folder</button>
          </div>
          <div id="skin-grid" class="skin-grid"></div>
          <div class="studio-controls">
            <div class="control-row">
              <label id="lbl-gauge">Gauge</label>
              <div class="segmented" id="gauge-selector">
                <button data-gauge="ring">Ring</button>
                <button data-gauge="bar">Bar</button>
                <button data-gauge="segments">Segs</button>
                <button data-gauge="wave">Wave</button>
              </div>
            </div>
            <div class="control-row colors">
              <label id="lbl-accents">Accents</label>
              <div class="color-pickers">
                <label class="color-chip"><span>G</span><input type="color" id="pick-gemini" /></label>
                <label class="color-chip"><span>C</span><input type="color" id="pick-claude" /></label>
                <label class="color-chip"><span>A</span><input type="color" id="pick-argon" /></label>
              </div>
            </div>
            <div class="control-row">
              <label id="lbl-radius">Radius</label>
              <input type="range" id="range-radius" min="6" max="32" step="1" />
              <span class="mono-val" id="val-radius">26px</span>
            </div>
            <div class="control-row">
              <label id="lbl-opacity">Opacity</label>
              <input type="range" id="range-opacity" min="45" max="100" step="1" />
              <span class="mono-val" id="val-opacity">95%</span>
            </div>
            <div class="control-row">
              <label id="lbl-glow">Glow</label>
              <label class="switch">
                <input type="checkbox" id="chk-glow" />
                <span class="slider"></span>
              </label>
            </div>
            <div class="save-skin-row">
              <input type="text" id="input-skin-name" placeholder="My Custom Skin" maxlength="28" />
              <button class="pill-btn primary" id="btn-save-skin">Save TOML</button>
            </div>
          </div>
        </section>

        <!-- Inline Settings Drawer -->
        <section id="drawer-settings" class="drawer hidden">
          <div class="drawer-header">
            <span class="drawer-title" id="settings-title">Preferences</span>
            <span class="version-tag">v0.2.1</span>
          </div>
          <div class="studio-controls">
            <div class="control-row">
              <label id="lbl-mode">Display</label>
              <div class="segmented" id="mode-selector">
                <button data-mode="island">Island</button>
                <button data-mode="notch_hug" id="btn-mode-notch">Notch</button>
                <button data-mode="widget">Widget</button>
              </div>
            </div>
            <div class="control-row">
              <label id="lbl-density">Pill Style</label>
              <div class="segmented" id="density-selector">
                <button data-density="glance">Glance</button>
                <button data-density="compact">Compact</button>
              </div>
            </div>
            <div class="control-row" id="row-position">
              <label id="lbl-position">Position</label>
              <button class="pill-btn compact-btn" id="btn-reset-pos">Top Center</button>
            </div>
            <div class="control-row hidden" id="row-menubar-text">
              <label id="lbl-menubar-text">Menu Bar Text</label>
              <label class="switch">
                <input type="checkbox" id="chk-menubar-text" />
                <span class="slider"></span>
              </label>
            </div>
            <div class="control-row">
              <label id="lbl-poll">Sync Rate</label>
              <div class="segmented" id="poll-selector">
                <button data-secs="5">5s</button>
                <button data-secs="15">15s</button>
                <button data-secs="30">30s</button>
                <button data-secs="60">60s</button>
              </div>
            </div>
            <div class="control-row">
              <label id="lbl-lang">Language</label>
              <div class="segmented" id="lang-selector">
                <button data-lang="auto">Auto</button>
                <button data-lang="zh">中文</button>
                <button data-lang="en">EN</button>
              </div>
            </div>
            <div class="control-row">
              <label id="lbl-notify">Alerts</label>
              <label class="switch">
                <input type="checkbox" id="chk-notify" />
                <span class="slider"></span>
              </label>
            </div>
            <div class="control-row">
              <label id="lbl-demo">Demo Mode</label>
              <label class="switch">
                <input type="checkbox" id="chk-demo" />
                <span class="slider"></span>
              </label>
            </div>
          </div>
        </section>

        <footer class="card-footer">
          <span id="account-label" class="account-text">Local loopback · Zero token storage</span>
          <div class="footer-actions">
            <button class="link-btn subtle" id="btn-hide-footer">Hide</button>
            <button class="link-btn subtle" id="btn-collapse">Collapse</button>
          </div>
        </footer>
      </div>
    </div>
  </div>
  <style id="custom-skin-css"></style>
  <script>
/*__SCRIPT__*/
  </script>
</body>
</html>
