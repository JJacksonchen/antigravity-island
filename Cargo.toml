[package]
name = "antigravity-island"
version = "0.2.3"
edition = "2021"
rust-version = "1.91"
description = "Lightweight cross-platform Rust Dynamic Island & desktop quota widget for Google Antigravity (macOS & Windows) with at-a-glance gauges and hot-reloadable custom skins"
license = "MIT"
repository = "https://github.com/JJacksonchen/antigravity-island"
keywords = ["antigravity", "dynamic-island", "quota", "macos", "windows"]
categories = ["gui", "command-line-utilities"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "7"
notify = "9"
raw-window-handle = "0.6"
regex = "1"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.37"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "net", "io-util", "fs"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tray-icon = "0.26"
wry = "0.57"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSString", "NSArray"] }
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSWindow",
    "NSScreen",
    "NSColor",
    "NSView",
    "NSRunningApplication",
    "objc2-core-foundation",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
axum = "0.8"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = "s"
