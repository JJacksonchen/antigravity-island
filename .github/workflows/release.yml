name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    name: macOS (${{ matrix.arch_label }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch_label: arm64
          - target: x86_64-apple-darwin
            arch_label: x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package tarball
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/antigravity-island dist/
          cp LICENSE README.md dist/
          tar -czf antigravity-island-macos-${{ matrix.arch_label }}.tar.gz -C dist antigravity-island LICENSE README.md

      - name: Upload macOS tarball to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: antigravity-island-macos-${{ matrix.arch_label }}.tar.gz

  build-windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-windows-x86_64-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}

      - name: Build Windows release binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package Windows zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/antigravity-island.exe dist/
          Copy-Item LICENSE, README.md dist/
          Compress-Archive -Path dist/* -DestinationPath antigravity-island-windows-x86_64.zip -Force

      - name: Upload Windows zip to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: antigravity-island-windows-x86_64.zip
